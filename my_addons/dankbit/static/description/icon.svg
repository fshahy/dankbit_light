<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 54 54" shape-rendering="crispEdges">
  <rect width="54" height="54" fill="#ffffff"/>
  <!-- green candle: wick + body -->
  <rect x="20" y="27" width="1" height="9" fill="#26a69a"/>
  <rect x="17" y="36" width="7" height="18" fill="#26a69a"/>
  <!-- red candle: wick + body -->
  <rect x="30" y="22" width="1" height="14" fill="#ef5350"/>
  <rect x="27" y="36" width="7" height="18" fill="#ef5350"/>
  <!-- price lines, drawn over the wicks -->
  <rect x="0" y="20" width="54" height="2" fill="#ab47bc"/>
  <rect x="0" y="28" width="54" height="3" fill="#6a1b9a"/>
</svg>
